name: Build

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Smoke check
        shell: pwsh
        run: ./scripts/dev_smoke.ps1

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: emergent-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
