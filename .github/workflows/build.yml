name: Build Mod

on:
  push:
    branches: ["main", "fix/**", "feature/**", "docs/**", "perf/**", "perf-*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Run smoke checks
        shell: pwsh
        timeout-minutes: 15
        run: ./scripts/dev_smoke.ps1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: emergent-${{ github.sha }}
          path: build/libs/*.jar
