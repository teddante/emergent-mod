name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Smoke check
        shell: pwsh
        run: ./scripts/dev_smoke.ps1

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          jar="$(find build/libs -maxdepth 1 -name 'emergent-*.jar' ! -name '*-sources.jar' -print -quit)"
          if [ -z "$jar" ]; then
            echo "No release jar found in build/libs" >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" "$jar" \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG"
